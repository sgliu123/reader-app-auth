<style>
:root {
  --bg: #f6f7fb; --text: #222; --primary: #4a6fa5; --card: #ffffff; --border: #ddd;
  --letter-spacing: 0px; --line-height: 1.8;
}
.dark-mode {
  --bg: #121212; --text: #e6e6e6; --primary: #6a8bc5; --card: #1e1e1e; --border: #333;
}

/* 10种背景 */
.bg-paper { --page-bg: #f8f6f2; --page-text: #2c2c2c; }
.bg-green { --page-bg: #cfe3d4; --page-text: #1a2f1e; }
.bg-pink { --page-bg: #fde8e8; --page-text: #4a2c2c; }
.bg-blue { --page-bg: #e8f4fd; --page-text: #1a3a4a; }
.bg-night { --page-bg: #2c3e50; --page-text: #ecf0f1; }
.bg-sepia { --page-bg: #f4ecd8; --page-text: #5c4b37; }
.bg-grey { --page-bg: #e0e0e0; --page-text: #212121; }
.bg-dark-green { --page-bg: #1a2f1e; --page-text: #c8e6c9; }
.bg-dark-blue { --page-bg: #0d1b2a; --page-text: #e0e1dd; }
.bg-black { --page-bg: #000; --page-text: #e0e0e0; }

* { box-sizing: border-box; }
body { margin:0; font-family: "Noto Sans SC", "Source Han Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

/* 顶部控制栏 */
.top-bar { 
  position: fixed; 
  top: 0; 
  left: 0; 
  right: 0; 
  height: 50px; 
  background: var(--card); 
  display: flex; 
  align-items: center; 
  padding: 0 10px; 
  gap: 5px; 
  box-shadow: 0 2px 8px rgba(0,0,0,.1); 
  z-index: 100; 
}

/* 主按钮组 */
.main-controls {
  display: flex;
  align-items: center;
  gap: 5px;
}

/* 组合按钮容器 */
.combo-btn {
  position: relative;
}

.combo-btn button {
  background: none;
  border: none;
  font-size: 14px;
  padding: 8px 10px;
  color: var(--text);
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.combo-btn button:hover {
  background: rgba(0,0,0,.05);
}

.combo-btn button.primary {
  background: var(--primary);
  color: white;
}

/* 下拉菜单 */
.dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: none;
  flex-direction: column;
  min-width: 140px;
  box-shadow: 0 2px 10px rgba(0,0,0,.1);
  z-index: 101;
}

.dropdown-menu.show {
  display: flex;
}

.dropdown-menu button {
  padding: 12px 15px;
  text-align: left;
  border: none;
  background: none;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s ease;
  border-radius: 0;
}

.dropdown-menu button:last-child {
  border-bottom: none;
}

.dropdown-menu button:hover {
  background: rgba(74, 111, 165, 0.1);
}

.dropdown-menu button.active {
  background: var(--primary);
  color: white;
}

/* 阅读区 */
#reader { height: calc(100vh - 130px); margin-top: 50px; margin-bottom: 80px; background: var(--page-bg); color: var(--page-text); position: relative; overflow: hidden; }
#viewer { width: 100%; height: 100%; overflow-y: auto; padding: 10px; }
#viewer iframe { transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
#viewer.flip-next iframe { transform: translateX(-100%); }
#viewer.flip-prev iframe { transform: translateX(100%); }

/* PDF/Word页面样式 */
.pdf-page { margin-bottom: 20px; background: var(--page-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.pdf-page img { max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 10px; }
.docx-page { margin-bottom: 20px; background: var(--page-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.docx-page img { max-width: 100%; height: auto; border-radius: 4px; margin: 10px 0; }
.sentence-p { padding: 10px; line-height: var(--line-height); margin: 0; letter-spacing: var(--letter-spacing); }

/* 底部控制栏 */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: var(--card); display: flex; align-items: center; padding: 0 10px; box-shadow: 0 -2px 8px rgba(0,0,0,.1); z-index: 100; flex-wrap: wrap; }
.bottom-controls { display: flex; align-items: center; width: 100%; }
.bottom-bar button { font-size: 20px; background: none; border: none; padding: 8px; color: var(--text); }
.progress-wrapper { flex: 1; margin: 0 12px; }
.progress-bar { height: 4px; background: #ccc; border-radius: 2px; cursor: pointer; }
.progress-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 2px; }

/* 播放进度显示 */
.progress-info {
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 5px 10px 0;
  font-size: 12px;
  color: var(--text);
  opacity: 0.8;
}
.progress-text {
  font-weight: bold;
  color: var(--primary);
}

/* 定时按钮容器 */
.timer-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
}
.countdown-display {
  font-size: 14px;
  font-weight: bold;
  color: var(--primary);
  background: rgba(74, 111, 165, 0.1);
  border-radius: 4px;
  padding: 4px 8px;
  display: none;
  white-space: nowrap;
}
.countdown-display.active {
  display: block;
}

/* 遮罩层 */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
.overlay.show { display: block; }

/* 侧边栏 */
.panel { position: fixed; top: 0; width: 300px; height: 100%; background: var(--card); padding: 15px; overflow-y: auto; z-index: 201; transition: transform .3s ease; }
.panel-left { left: 0; transform: translateX(-100%); }
.panel-right { right: 0; transform: translateX(100%); }
.panel.open { transform: translateX(0); }

/* 设置项 */
.setting-group { margin-bottom: 20px; }
.setting-group label { display: block; margin-bottom: 8px; font-weight: bold; }
.setting-group select, .setting-group input[type=range] { width: 100%; }
.font-btns button { margin: 2px; padding: 8px 12px; border: 1px solid var(--border); background: none; border-radius: 4px; cursor: pointer; }
.font-btns button.active { background: var(--primary); color: white; border-color: var(--primary); }

/* 10种背景选择 */
.bg-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.bg-option { height: 40px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.bg-option.active { border-color: var(--primary); }

/* 笔记高亮 */
.highlight-yellow { background-color: rgba(255, 235, 59, 0.5) !important; }
.highlight-blue { background-color: rgba(33, 150, 243, 0.4) !important; }
.highlight-green { background-color: rgba(76, 175, 80, 0.4) !important; }

/* 笔记弹窗 */
.note-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: none; justify-content: center; align-items: center; }
.note-modal.show { display: flex; }
.note-content { background: var(--card); padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
.note-content textarea { width: 100%; height: 100px; margin-top: 10px; background: var(--bg); color: var(--text); border: 1px solid #ccc; border-radius: 4px; padding: 10px; }

/* 笔记列表 */
.note-item { padding: 10px; border-bottom: 1px solid var(--border); }
.note-item.selected { background: rgba(74,111,165,0.1); }

/* 目录项 */
.toc-item { padding: 12px 10px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }
.toc-item:hover { background: rgba(74,111,165,.1); }
.toc-item.active { background: var(--primary); color: white; }

/* 当前朗读高亮 */
.current { background: rgba(74,111,165,.3); border-radius: 4px; scroll-margin-top: 60px; }

/* 帮助弹窗 */
.help-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; display: none; justify-content: center; align-items: center; }
.help-modal.show { display: flex; }
.help-content { background: var(--card); padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.help-content h2 { margin-top: 0; color: var(--primary); }
.help-content h3 { color: var(--primary); margin-top: 20px; }
.help-content ul { padding-left: 20px; }
.help-content li { margin-bottom: 8px; line-height: 1.6; }
.help-content code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-family: monospace; }

/* 响应式 */
@media (max-width: 768px) {
  .top-bar button span { display: none; }
  .top-bar button { padding: 8px; }
  .countdown-display {
    font-size: 12px;
    padding: 3px 6px;
  }
  .combo-btn button span {
    display: none;
  }
}

/* 音色选择器样式 */
.voice-selector-container {
  position: relative;
  width: 100%;
}
.voice-search-box {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
.voice-list-container {
  max-height: 250px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  scrollbar-width: thin;
  scrollbar-color: var(--primary) var(--bg);
}
.voice-list-container::-webkit-scrollbar {
  width: 8px;
}
.voice-list-container::-webkit-scrollbar-track {
  background: var(--bg);
  border-radius: 4px;
}
.voice-list-container::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 4px;
}
.voice-item {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.voice-item:hover {
  background: rgba(74, 111, 165, 0.1);
}
.voice-item.active {
  background: var(--primary);
  color: white;
}
.voice-name {
  font-weight: 500;
  font-size: 14px;
}
.voice-lang {
  font-size: 12px;
  opacity: 0.8;
}
.no-voices {
  padding: 20px;
  text-align: center;
  color: #888;
  font-style: italic;
}

/* 书籍库样式 */
.library-item {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
}
.library-item:hover {
  background: rgba(74, 111, 165, 0.1);
}
.library-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.library-item-title {
  font-weight: 500;
  font-size: 14px;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.library-item-time {
  font-size: 12px;
  color: #888;
}
.library-delete-btn {
  background: none;
  border: none;
  color: #ff4444;
  cursor: pointer;
  font-size: 16px;
  margin-left: 10px;
  padding: 0 5px;
}
.library-submenu {
  margin-top: 8px;
  padding-left: 15px;
  display: none;
}
.library-submenu.show {
  display: block;
}
.library-submenu-item {
  padding: 8px 0;
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
}
.library-submenu-item:hover {
  text-decoration: underline;
}
.library-notes-list {
  margin-top: 10px;
  padding: 10px;
  background: var(--bg);
  border-radius: 4px;
  max-height: 200px;
  overflow-y: auto;
}
.library-note-item {
  padding: 8px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 12px;
}
.library-note-item:last-child {
  border-bottom: none;
}
.library-empty {
  padding: 20px;
  text-align: center;
  color: #888;
  font-style: italic;
}
.library-clear-btn {
  padding: 8px 12px;
  background: #ff4444;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

/* 搜索弹窗样式 */
.search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; display: none; justify-content: center; align-items: center; }
.search-modal.show { display: flex; }
.search-content { background: var(--card); padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
.search-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.search-title { margin: 0; color: var(--primary); }
.close-search-btn { background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; padding: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
.search-input-container { display: flex; gap: 10px; margin-bottom: 20px; }
.search-input { flex: 1; padding: 12px 15px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 16px; }
.search-btn { padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
.search-results { max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
.search-result-item { padding: 12px 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s ease; }
.search-result-item:hover { background: rgba(74, 111, 165, 0.1); }
.search-result-item:last-child { border-bottom: none; }
.search-result-context { font-size: 14px; line-height: 1.6; margin-bottom: 5px; }
.search-result-position { font-size: 12px; color: #888; }
.search-highlight { background-color: rgba(255, 235, 59, 0.7); padding: 0 2px; border-radius: 2px; }
.search-no-results { padding: 20px; text-align: center; color: #888; font-style: italic; }

/* 定时菜单样式 */
.timer-menu {
  position: absolute;
  bottom: 45px;
  right: 0;
  background: var(--card);
  border:1px solid var(--border);
  border-radius: 6px;
  display: none;
  flex-direction: column;
  min-width: 120px;
  box-shadow: 0 2px 10px rgba(0,0,0,.1);
  z-index: 101;
}
.timer-menu button {
  padding: 12px 15px;
  text-align: left;
  border: none;
  background: none;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s ease;
}
.timer-menu button:last-child {
  border-bottom: none;
}
.timer-menu button:hover {
  background: rgba(74, 111, 165, 0.1);
}
.timer-menu button.active {
  background: var(--primary);
  color: white;
}

/* 导出选择弹窗样式 */
.export-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 400;
  display: none;
  justify-content: center;
  align-items: center;
}
.export-modal.show {
  display: flex;
}
.export-content {
  background: var(--card);
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
}
.export-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.export-title {
  margin: 0;
  color: var(--primary);
}
.close-export-btn {
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text);
  cursor: pointer;
  padding: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.export-options {
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.export-option {
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}
.export-option:hover {
  background: rgba(74, 111, 165, 0.1);
  border-color: var(--primary);
}
.export-option h3 {
  margin: 0 0 5px 0;
  color: var(--primary);
}
.export-option p {
  margin: 0;
  font-size: 14px;
  color: #888;
}

/* AI总结弹窗样式 */
.ai-summary-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 500;
  display: none;
  justify-content: center;
  align-items: center;
}
.ai-summary-modal.show {
  display: flex;
}
.ai-summary-content {
  background: var(--card);
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 800px;
  max-height: 85vh;
  overflow-y: auto;
}
.ai-summary-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.ai-summary-title {
  margin: 0;
  color: var(--primary);
  font-size: 24px;
}
.close-ai-summary-btn {
  background: none;
  border: none;
  font-size: 24px;
  color: var(--text);
  cursor: pointer;
  padding: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-summary-type-selector {
  display: flex;
  gap: 15px;
  margin-bottom: 25px;
}
.ai-summary-type-btn {
  flex: 1;
  padding: 15px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s ease;
}
.ai-summary-type-btn:hover {
  border-color: var(--primary);
  background: rgba(74, 111, 165, 0.1);
}
.ai-summary-type-btn.active {
  border-color: var(--primary);
  background: var(--primary);
  color: white;
}
.ai-summary-body {
  margin-bottom: 25px;
}
.ai-summary-text {
  background: var(--bg);
  padding: 20px;
  border-radius: 8px;
  line-height: 1.8;
  font-size: 16px;
  max-height: 400px;
  overflow-y: auto;
  border: 1px solid var(--border);
}
.ai-summary-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.ai-summary-stats {
  font-size: 14px;
  color: #888;
}
.ai-summary-actions {
  display: flex;
  gap: 10px;
}
.ai-summary-action-btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
}
.ai-summary-action-btn.primary {
  background: var(--primary);
  color: white;
}
.ai-summary-action-btn.secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
.ai-summary-action-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
.ai-summary-loading {
  text-align: center;
  padding: 40px;
  color: var(--primary);
}
.ai-summary-error {
  background: rgba(255, 68, 68, 0.1);
  color: #ff4444;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 68, 68, 0.3);
}

/* ===== 新增：法律合规弹窗样式 ===== */
.legal-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 999;
  display: none;
  justify-content: center;
  align-items: center;
}
.legal-modal.show {
  display: flex;
}
.legal-content {
  background: var(--card);
  padding: 30px;
  border-radius: 12px;
  width: 90%;
  max-width: 700px;
  max-height: 85vh;
  overflow-y: auto;
}
.legal-header {
  text-align: center;
  margin-bottom: 25px;
}
.legal-header h2 {
  margin: 0 0 10px 0;
  color: var(--primary);
  font-size: 24px;
}

  // ★★★ 核心：激活（请求云函数）★★★
  async activate(licenseKey) {
    licenseKey = licenseKey.toUpperCase().trim();
    if (!licenseKey) return { success: false, error: '授权码不能为空' };

    try {
      // 第一步：验证授权码是否有效
      const validateResponse = await fetch(CONFIG.VALIDATE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          licenseKey: licenseKey,
          deviceId: this.state.deviceId
        })
      });

      const validateResult = await validateResponse.json();

      // 检查授权码是否有效
      if (!validateResult.valid && !validateResult.success) {
        return { success: false, error: validateResult.error || '授权码无效或已被使用' };
      }

      // 第二步：绑定设备（激活）
      const bindResponse = await fetch(CONFIG.LICENSE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'bind',
          licenseKey: licenseKey,
          deviceId: this.state.deviceId,
          deviceName: this.state.deviceName
        })
      });

      const bindResult = await bindResponse.json();

      if (bindResult.success || bindResult.code === 200) {
        // 从验证结果或绑定结果获取过期时间
        const keyData = validateResult.key || bindResult.key || {};
        const expiresAt = keyData.expiresAt || keyData.expiration || null;

        this.state.isActivated = true;
        this.state.licenseKey = licenseKey;
        this.state.activatedAt = Date.now();
        this.state.expiresAt = expiresAt;
        this.state.features = CONFIG.FEATURES.FULL;
        this.state.lastVerify = Date.now();
        this.state.nextVerify = Date.now() + (CONFIG.CACHE_DAYS + CONFIG.GRACE_DAYS) * 86400000;

        this.saveToStorage();
        return { success: true, expiresAt: expiresAt, features: CONFIG.FEATURES.FULL };
      } else {
        // 处理绑定失败，包括设备已被绑定的情况
        const errorMsg = bindResult.error || '绑定设备失败';
        return { success: false, error: errorMsg, deviceMismatch: bindResult.deviceMismatch || false };
      }
    } catch (error) {
      console.error('激活失败:', error);
      return { success: false, error: '网络连接失败，无法验证授权' };
    }
  },

  // ★★★ 核心：验证（请求云函数）★★★
  async silentVerify() {
    if (!this.state.isActivated || !this.state.licenseKey) return false;

    try {
      const response = await fetch(CONFIG.VALIDATE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          licenseKey: this.state.licenseKey,
          deviceId: this.state.deviceId
        })
      });

      const result = await response.json();

      if (result.valid === true || result.success === true) {
        this.state.lastVerify = Date.now();
        this.state.nextVerify = Date.now() + (CONFIG.CACHE_DAYS + CONFIG.GRACE_DAYS) * 86400000;
        this.saveToStorage();
        return true;
      } else {
        this.deactivate();
        return false;
      }
    } catch (error) {
      return true; // 网络错误时信任本地缓存
    }
  },

  deactivate() {
    this.state = {
      isActivated: false, licenseKey: null, activatedAt: null,
      expiresAt: null, deviceId: this.state.deviceId,
      deviceName: this.state.deviceName, features: [],
      lastVerify: null, nextVerify: null
    };
    this.saveToStorage();
  },

  hasFeature(feature) {
    if (CONFIG.FEATURES.BASIC.includes(feature)) return true;
    if (!this.state.isActivated) return false;
    if (this.state.expiresAt && Date.now() > this.state.expiresAt) {
      this.deactivate(); return false;
    }
    return this.state.features.includes(feature) || CONFIG.FEATURES.FULL.includes(feature);
  },

  getInfo() {
    return {
      isActivated: this.state.isActivated,
      licenseKey: this.state.licenseKey ? this.state.licenseKey.substring(0,8)+'****' : null,
      activatedAt: this.state.activatedAt ? new Date(this.state.activatedAt).toLocaleString() : null,
      expiresAt: this.state.expiresAt ? new Date(this.state.expiresAt).toLocaleString() : '永久',
      deviceId: this.state.deviceId ? this.state.deviceId.substring(0,12)+'...' : null,
      daysRemaining: this.state.expiresAt ? Math.ceil((this.state.expiresAt - Date.now()) / 86400000) : '永久'
    };
  }
};
